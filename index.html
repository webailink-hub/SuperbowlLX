<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>SB 2026 Pool | Patriots vs Seahawks</title>
    
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&family=Roboto+Condensed:wght@400;700&family=Black+Ops+One&display=swap" rel="stylesheet">

    <style>
        :root {
            --pats-blue: #002244;
            --pats-red: #C60C30;
            --hawks-blue: #002244;
            --hawks-green: #69BE28;
            --brand-gray: #f2f2f2;
            --score-bg: #1a1a1a;
        }
        body { font-family: 'Roboto Condensed', sans-serif; background-color: var(--brand-gray); }
        .teko { font-family: 'Teko', sans-serif; text-transform: uppercase; }
        .digital-font { font-family: 'Black Ops One', cursive; }
        
        /* --- GRID LAYOUT --- */
        .grid-wrapper {
            display: grid;
            /* Increased cell min-width for better visibility on mobile */
            grid-template-columns: 45px 55px repeat(10, minmax(70px, 1fr)); 
            overflow: auto;
            max-height: 70vh;
            position: relative;
            background: white;
            border: 1px solid #ddd;
            scroll-behavior: smooth;
        }

        /* 1. Team Header (Top) */
        .header-team-top {
            grid-column: 3 / span 10;
            position: sticky;
            top: 0;
            z-index: 40;
            background: var(--pats-blue);
            color: white;
            text-align: center;
            font-family: 'Teko', sans-serif;
            font-size: 1.75rem;
            line-height: 2.5rem;
            border-bottom: 4px solid var(--pats-red);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* 2. Top Numbers Row */
        .header-nums-top {
            position: sticky;
            top: 40px; 
            z-index: 30;
            background: #f8fafc;
            border-bottom: 2px solid #cbd5e1;
            font-weight: 900;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 50px;
            color: var(--pats-blue);
        }

        /* 3. Team Header (Left Vertical) */
        .header-team-left {
            grid-row: 3 / span 10;
            grid-column: 1;
            position: sticky;
            left: 0;
            z-index: 40;
            background: white;
            color: var(--hawks-blue);
            border-right: 4px solid var(--hawks-green);
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            text-align: center;
            font-family: 'Teko', sans-serif;
            font-size: 1.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 0;
            box-shadow: 4px 0 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* 4. Side Numbers Col */
        .header-nums-left {
            position: sticky;
            left: 45px;
            z-index: 30;
            background: #f8fafc;
            border-right: 2px solid #cbd5e1;
            font-weight: 900;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--hawks-blue);
        }

        /* Corner Block */
        .corner-block {
            grid-column: 1 / span 2;
            grid-row: 1 / span 2;
            position: sticky;
            top: 0;
            left: 0;
            z-index: 50;
            background: #0f172a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            border-bottom: 1px solid #334155;
            border-right: 1px solid #334155;
            font-weight: bold;
        }
        
        .winner-cell {
            background-color: #fbbf24 !important;
            color: black !important;
            font-weight: 900;
            border: 3px solid black;
            position: relative;
            z-index: 20;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }

        /* Custom Scrollbar for better UX */
        .grid-wrapper::-webkit-scrollbar { width: 8px; height: 8px; }
        .grid-wrapper::-webkit-scrollbar-track { background: #f1f5f9; }
        .grid-wrapper::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100 text-slate-900 pb-20">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- FINALIZED Data ---
        // Names updated based on user request
        const FINAL_GRID = [
            ['Janette', 'P2', 'Gary', 'Vince', 'Franco', 'Rick', 'Barajas', 'Ruth', 'Janette', 'Franco'],
            ['Peter K', 'Tom', 'Nate', 'Lolo', 'Tom', 'Tia', 'Gigi', 'Connor T', 'Rick', 'Barajas'],
            ['Janie', 'Janette', 'Cathy Q', 'Chris Calv', 'Ish', 'Peter K', 'Nate', 'Gary', 'Lolo', 'Ruth'],
            ['Franco', 'Jenn*', 'Jenn Garcia', 'Jordan S.', 'Barajas', 'Vargas', 'Andrew/MK', 'Fabian', 'Jenn*', 'GIGI'],
            ['Maryana/AG', 'Lance', 'GIGI', 'James', 'Connor T', 'Janette', 'Cathy Q', 'Franco', 'Lolo', 'Hay'],
            ['Barajas', 'Chris Cal', 'ISH', 'Fabian', 'Tank PM', 'Lance', 'Gary', 'Jordan S', 'Tom', 'Janie'],
            ['Gigi', 'Tia', 'Franco', 'Ray', 'Vargas', 'Barajas', 'James', 'Chris Cal', 'Happy', 'Ruth'],
            ['Vince', 'Gary', 'Jenn*', 'Cathy Q', 'Happy', 'Jordan S', 'Rick', 'Vargas', 'Jenn Garcia', 'Franco'],
            ['Lolo', 'Connor T', 'Rick', 'Lolo', 'Barajas', 'GIGI', 'Jenn*', 'Peter K', 'Tom', 'Andrew'],
            ['Fabian', 'Nate', 'P2', 'Janette', 'Tom', 'Ruth', 'Franco', 'P2', 'P2', 'Rick']
        ];
        
        // Finalized Random Numbers
        const FINAL_TOP_NUMS = [9, 3, 7, 0, 5, 6, 1, 8, 2, 4]; // Patriots (Top)
        const FINAL_SIDE_NUMS = [7, 1, 0, 6, 5, 9, 4, 2, 3, 8]; // Seahawks (Side)

        // --- Components ---

        const Countdown = () => {
            const target = new Date('2026-02-08T15:30:00-08:00').getTime();
            const [timeLeft, setTimeLeft] = useState(calculateTimeLeft());

            function calculateTimeLeft() {
                const now = new Date().getTime();
                const difference = target - now;
                if (difference <= 0) return null;
                return {
                    days: Math.floor(difference / (1000 * 60 * 60 * 24)),
                    hours: Math.floor((difference / (1000 * 60 * 60)) % 24),
                    minutes: Math.floor((difference / 1000 / 60) % 60),
                    seconds: Math.floor((difference / 1000) % 60)
                };
            }

            useEffect(() => {
                const timer = setInterval(() => setTimeLeft(calculateTimeLeft()), 1000);
                return () => clearInterval(timer);
            }, []);

            if (!timeLeft) return <div className="bg-red-600 text-white text-center py-4 font-black text-2xl animate-pulse">GAME LIVE</div>;

            return (
                <div className="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 text-white py-4 px-4 flex flex-col items-center justify-center shadow-lg">
                    <span className="text-gray-400 uppercase tracking-[0.2em] text-xs font-bold mb-1">Super Bowl LIX Kickoff</span>
                    <div className="font-mono text-3xl md:text-5xl font-black text-white flex gap-3 items-center" style={{ textShadow: '0 0 10px rgba(255,255,255,0.3)' }}>
                        <div className="flex flex-col items-center"><span className="leading-none">{timeLeft.days}</span><span className="text-[10px] text-gray-500 font-sans font-normal uppercase">Days</span></div>
                        <span className="text-gray-600 -mt-3">:</span>
                        <div className="flex flex-col items-center"><span className="leading-none">{timeLeft.hours}</span><span className="text-[10px] text-gray-500 font-sans font-normal uppercase">Hrs</span></div>
                        <span className="text-gray-600 -mt-3">:</span>
                        <div className="flex flex-col items-center"><span className="leading-none">{timeLeft.minutes}</span><span className="text-[10px] text-gray-500 font-sans font-normal uppercase">Min</span></div>
                        <span className="text-gray-600 -mt-3">:</span>
                        <div className="flex flex-col items-center"><span className="text-[var(--pats-red)] leading-none">{timeLeft.seconds}</span><span className="text-[10px] text-gray-500 font-sans font-normal uppercase">Sec</span></div>
                    </div>
                </div>
            );
        };

        function App() {
            // State
            // Grid and Nums are now static constants, no need for State for editing
            const grid = FINAL_GRID;
            const topNums = FINAL_TOP_NUMS;
            const sideNums = FINAL_SIDE_NUMS;
            
            // "Live" Score State (for the big winner display)
            const [liveScore, setLiveScore] = useState(() => load('sb_liveScore', { top: '', side: '' }));

            // Quarterly Scores State (for the record)
            const [scores, setScores] = useState(() => load('sb_scores', {
                q1: { top: '', side: '' },
                q2: { top: '', side: '' },
                q3: { top: '', side: '' },
                final: { top: '', side: '' }
            }));
            
            // Persistence
            useEffect(() => save('sb_scores', scores), [scores]);
            useEffect(() => save('sb_liveScore', liveScore), [liveScore]);

            function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } }
            function save(k, v) { localStorage.setItem(k, JSON.stringify(v)); }

            // Logic
            const getWinner = (s) => {
                if (s.top === '' || s.side === '') return null;
                const tDigit = Math.abs(parseInt(s.top) || 0) % 10;
                const sDigit = Math.abs(parseInt(s.side) || 0) % 10;
                
                const cIdx = topNums.indexOf(tDigit);
                const rIdx = sideNums.indexOf(sDigit);
                
                if (cIdx === -1 || rIdx === -1) return "Error";
                return { name: grid[rIdx][cIdx] || "Open", top: tDigit, side: sDigit };
            };

            const updateQuarterScore = (q, team, val) => {
                setScores(prev => ({
                    ...prev,
                    [q]: { ...prev[q], [team]: val }
                }));
            };

            const updateLiveScore = (team, val) => {
                setLiveScore(prev => ({ ...prev, [team]: val }));
            };

            const liveWinner = getWinner(liveScore);
            const q1Win = getWinner(scores.q1);
            const q2Win = getWinner(scores.q2);
            const q3Win = getWinner(scores.q3);
            const finalWin = getWinner(scores.final);

            const activeHighlight = liveWinner ? `${liveWinner.side}-${liveWinner.top}` : null;

            return (
                <div className="min-h-screen bg-slate-50 font-sans">
                    <Countdown />
                    
                    {/* Header Controls */}
                    <div className="bg-white border-b border-gray-200 px-4 py-2 flex justify-between items-center">
                        <div className="text-xs font-bold text-gray-400 uppercase tracking-widest">Pool Manager</div>
                        <div className="text-[10px] font-bold px-3 py-1 rounded uppercase tracking-wider bg-gray-100 text-green-700 flex items-center gap-1">
                            <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                            Finalized
                        </div>
                    </div>

                    <div className="max-w-3xl mx-auto p-4 space-y-6">
                        
                        {/* 1. CURRENT LIVE WINNER & SCORE SECTION */}
                        <div className="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden relative">
                            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-900 via-green-600 to-blue-900"></div>
                            
                            {/* Live Score Inputs */}
                            <div className="p-4 bg-slate-50 flex items-center justify-center gap-6 md:gap-12">
                                <div className="text-center">
                                    <label className="block text-[10px] font-black text-blue-900 uppercase tracking-widest mb-1">Patriots</label>
                                    <input 
                                        type="number" 
                                        placeholder="0"
                                        value={liveScore.top}
                                        onChange={(e) => updateLiveScore('top', e.target.value)}
                                        className="w-20 h-16 md:w-24 md:h-20 text-center text-4xl md:text-5xl font-black bg-white border-2 border-gray-200 rounded-lg focus:border-blue-900 focus:ring-4 focus:ring-blue-100 outline-none transition-all text-slate-800"
                                    />
                                </div>
                                <div className="text-2xl font-black text-gray-300">VS</div>
                                <div className="text-center">
                                    <label className="block text-[10px] font-black text-[var(--hawks-green)] uppercase tracking-widest mb-1">Seahawks</label>
                                    <input 
                                        type="number" 
                                        placeholder="0"
                                        value={liveScore.side}
                                        onChange={(e) => updateLiveScore('side', e.target.value)}
                                        className="w-20 h-16 md:w-24 md:h-20 text-center text-4xl md:text-5xl font-black bg-white border-2 border-gray-200 rounded-lg focus:border-green-600 focus:ring-4 focus:ring-green-100 outline-none transition-all text-slate-800"
                                    />
                                </div>
                            </div>

                            {/* Prominent Winner Display */}
                            <div className="bg-slate-900 text-white p-4 text-center">
                                <div className="text-xs font-bold text-yellow-500 uppercase tracking-[0.2em] mb-1 animate-pulse">
                                    Current Projected Winner
                                </div>
                                <div className="text-3xl md:text-4xl font-black uppercase tracking-tight truncate leading-tight">
                                    {liveWinner ? liveWinner.name : <span className="text-slate-700">Waiting for Score...</span>}
                                </div>
                                {liveWinner && (
                                    <div className="mt-2 inline-block px-3 py-1 bg-slate-800 rounded-full text-[10px] font-mono border border-slate-700">
                                        Square: SEA {liveWinner.side} - NE {liveWinner.top}
                                    </div>
                                )}
                            </div>
                        </div>


                        {/* 2. QUARTERLY SCOREBOARD */}
                        <div className="bg-black rounded-xl overflow-hidden shadow-md">
                            <div className="flex justify-between items-center px-4 py-2 bg-gray-900 border-b border-gray-800">
                                <span className="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Quarterly Payouts</span>
                                <span className="text-[10px] font-bold text-gray-600">OFFICIAL RECORD</span>
                            </div>
                            
                            <div className="grid grid-cols-4 divide-x divide-gray-800">
                                {[
                                    { id: 'q1', label: '1st', amt: '$150', score: scores.q1 },
                                    { id: 'q2', label: '2nd', amt: '$200', score: scores.q2 },
                                    { id: 'q3', label: '3rd', amt: '$200', score: scores.q3 },
                                    { id: 'final', label: 'Final', amt: '$400', score: scores.final }
                                ].map((q) => (
                                    <div key={q.id} className="p-2 flex flex-col items-center">
                                        <div className="text-[10px] font-bold text-gray-500 mb-1">{q.label} <span className="text-green-500">{q.amt}</span></div>
                                        <div className="flex flex-col gap-1 w-full max-w-[50px]">
                                            <input 
                                                type="number" placeholder="NE" 
                                                className="w-full bg-gray-800 text-white text-center text-xs font-bold py-1 rounded border border-gray-700 focus:border-blue-500 outline-none"
                                                value={q.score.top}
                                                onChange={(e) => updateQuarterScore(q.id, 'top', e.target.value)}
                                            />
                                            <input 
                                                type="number" placeholder="SEA" 
                                                className="w-full bg-gray-800 text-white text-center text-xs font-bold py-1 rounded border border-gray-700 focus:border-green-500 outline-none"
                                                value={q.score.side}
                                                onChange={(e) => updateQuarterScore(q.id, 'side', e.target.value)}
                                            />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>


                        {/* 3. THE GRID */}
                        <div className="bg-white shadow-xl rounded-lg overflow-hidden border border-slate-300">
                            <div className="grid-wrapper text-sm">
                                
                                {/* 0. Corner */}
                                <div className="corner-block">
                                    <div className="flex flex-col items-center leading-none">
                                        <span className="text-[var(--hawks-green)] text-xs">SEA</span>
                                        <span className="text-gray-500 text-[8px]">▼</span>
                                        <span className="text-[var(--pats-red)] text-xs">NE</span>
                                    </div>
                                </div>

                                {/* 1. Patriots Header */}
                                <div className="header-team-top">
                                    <span className="tracking-wide">NEW ENGLAND</span>
                                </div>

                                {/* 2. Top Numbers */}
                                {topNums.map((n, i) => (
                                    <div key={`tn-${i}`} className="header-nums-top" style={{ gridColumn: i + 3 }}>
                                        {n}
                                    </div>
                                ))}

                                {/* 3. Seahawks Header */}
                                <div className="header-team-left">
                                    <span className="tracking-wide">SEATTLE SEAHAWKS</span>
                                </div>

                                {/* 4. Rows */}
                                {sideNums.map((sNum, rIdx) => (
                                    <React.Fragment key={`row-${rIdx}`}>
                                        
                                        {/* Side Number */}
                                        <div className="header-nums-left" style={{ gridRow: rIdx + 3 }}>
                                            {sNum}
                                        </div>

                                        {/* Grid Cells */}
                                        {topNums.map((tNum, cIdx) => {
                                            const isActive = activeHighlight === `${sNum}-${tNum}`;
                                            
                                            return (
                                                <div 
                                                    key={`${rIdx}-${cIdx}`}
                                                    className={`
                                                        border-b border-r border-gray-200 flex items-center justify-center p-1 text-center
                                                        ${isActive ? 'winner-cell' : 'bg-white text-slate-700'}
                                                    `}
                                                    style={{ gridRow: rIdx + 3, gridColumn: cIdx + 3 }}
                                                >
                                                    <span className="leading-tight text-xs md:text-sm font-medium break-words w-full px-0.5">
                                                        {grid[rIdx][cIdx]}
                                                    </span>
                                                </div>
                                            );
                                        })}

                                    </React.Fragment>
                                ))}

                            </div>
                            <div className="p-2 bg-gray-50 text-[10px] text-gray-400 text-center uppercase tracking-wider font-bold">
                                Swipe/Scroll to view full grid
                            </div>
                        </div>

                    </div>

                    <footer className="mt-12 mb-6 text-center">
                        <div className="text-[10px] text-slate-400 font-medium uppercase tracking-widest">
                            Website Developed by Andrew Gutierrez • (949) 576-4936
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
